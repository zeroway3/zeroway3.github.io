<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 600" font-family="Noto Sans KR, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0c0b"/>
      <stop offset="100%" stop-color="#1c1310"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6A13"/>
    </marker>
    <marker id="arrowMuted2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6660"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="600" fill="url(#bg2)"/>

  <text x="40" y="36" fill="#ffffff" font-size="20" font-weight="800">데이터플로우 — 미러링 동기화</text>
  <text x="40" y="58" fill="#cfc7bd" font-size="12.5">si_connect(원본) → 로컬 미러 테이블, 2개 경로가 병행 유지</text>

  <!-- Box: si_connect 원본 -->
  <rect x="40" y="200" width="220" height="220" rx="12" fill="#1c1310" stroke="#33261f" stroke-width="1.5"/>
  <text x="58" y="230" fill="#ffffff" font-size="14.5" font-weight="800">si_connect</text>
  <text x="58" y="248" fill="#cfc7bd" font-size="10.5">원본 데이터</text>
  <rect x="55" y="262" width="190" height="42" rx="8" fill="#2a1f19"/>
  <text x="70" y="288" fill="#ffffff" font-size="12">devices / points</text>
  <rect x="55" y="314" width="190" height="42" rx="8" fill="#2a1f19"/>
  <text x="70" y="340" fill="#ffffff" font-size="12">subscriptions</text>
  <rect x="55" y="366" width="190" height="42" rx="8" fill="#2a1f19"/>
  <text x="70" y="392" fill="#ffffff" font-size="12">raw_histories</text>

  <!-- Path 1: 즉시 upsert -->
  <line x1="260" y1="250" x2="470" y2="250" stroke="#FF6A13" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="290" y="238" fill="#FF6A13" font-size="11.5" font-weight="700">① 등록 API 호출 → 즉시 upsert</text>
  <text x="290" y="266" fill="#a89f96" font-size="10">registerPoint / registerSystem</text>

  <!-- Path 2: 이벤트 기반 -->
  <rect x="330" y="330" width="220" height="90" rx="10" fill="#2a1f19" stroke="#33261f"/>
  <text x="348" y="356" fill="#ffffff" font-size="12.5" font-weight="700">Redis Stream</text>
  <text x="348" y="374" fill="#a89f96" font-size="10">sicore.v1.subscription.{tenant}</text>
  <text x="348" y="390" fill="#a89f96" font-size="10">sicore.v1.device.status.{tenant}</text>
  <line x1="260" y1="380" x2="330" y2="380" stroke="#FF6A13" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="270" y="322" fill="#FF6A13" font-size="11.5" font-weight="700">② 변경 이벤트 발행</text>
  <line x1="550" y1="375" x2="640" y2="335" stroke="#FF6A13" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="555" y="330" fill="#a89f96" font-size="10">Consumer Group · XREADGROUP</text>

  <!-- 스냅샷 동기화 버퍼링 -->
  <rect x="330" y="440" width="220" height="70" rx="10" fill="#1c1310" stroke="#6b6660" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="348" y="464" fill="#cfc7bd" font-size="11.5" font-weight="700">동시성 제어</text>
  <text x="348" y="482" fill="#a89f96" font-size="10">스냅샷 동기화 중 이벤트 버퍼링</text>
  <text x="348" y="497" fill="#a89f96" font-size="10">완료 후 순서대로 replay</text>
  <line x1="440" y1="420" x2="440" y2="440" stroke="#6b6660" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Box: 로컬 미러 -->
  <rect x="640" y="210" width="240" height="200" rx="12" fill="#1c1310" stroke="#FF6A13" stroke-width="1.5"/>
  <text x="658" y="240" fill="#ffffff" font-size="14.5" font-weight="800">로컬 미러 테이블</text>
  <text x="658" y="258" fill="#cfc7bd" font-size="10.5">si_backend / fms-api</text>
  <rect x="655" y="272" width="205" height="46" rx="8" fill="#2a1f19"/>
  <text x="670" y="292" fill="#ffffff" font-size="12">si_connect_devices</text>
  <text x="670" y="308" fill="#a89f96" font-size="9.5">si_connect_points</text>
  <rect x="655" y="326" width="205" height="70" rx="8" fill="#2a1f19"/>
  <text x="670" y="346" fill="#ffffff" font-size="12">si_connect_subscriptions</text>
  <text x="670" y="364" fill="#a89f96" font-size="9.5">+ 로컬 전용 업무 컬럼</text>
  <text x="670" y="380" fill="#a89f96" font-size="9.5">(siteCode, isUse, isDelete 등)</text>

  <!-- 보호 로직 강조 -->
  <rect x="900" y="255" width="280" height="110" rx="12" fill="#2a1f19" stroke="#FF6A13" stroke-width="1.5"/>
  <text x="918" y="282" fill="#FF6A13" font-size="13" font-weight="800">보호 규칙</text>
  <text x="918" y="304" fill="#ffffff" font-size="11">화면 전용 컬럼은 UPDATE</text>
  <text x="918" y="320" fill="#ffffff" font-size="11">대상에서 명시적으로 제외</text>
  <text x="918" y="342" fill="#a89f96" font-size="10">→ 외부 이벤트가 로컬 업무</text>
  <text x="918" y="356" fill="#a89f96" font-size="10">데이터를 덮어쓰지 못함</text>
  <line x1="880" y1="300" x2="900" y2="300" stroke="#FF6A13" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="40" y="560" fill="#6b6660" font-size="11">③ 풀 스냅샷(전체 재동기화)은 레거시 식별자 파괴 위험으로 비활성화 — ①·②만으로 정합성 유지</text>
</svg>
