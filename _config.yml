# ==========================================================
# 개인 정보는 이 파일에서 수정하세요 (name, description, author, url 등)
# ==========================================================

theme                    : null
remote_theme             : "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin    : "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

locale                   : "ko-KR"
title                    : "김영식"
title_separator          : "-"
name                     : "김영식"
description              : "실시간 IoT 데이터 파이프라인과 멀티테넌트 백엔드를 만드는 백엔드 개발자입니다."
url                      : "https://zeroway3.github.io"
baseurl                  : ""
repository               : "zeroway3/zeroway3.github.io"
teaser                   :
logo                     :
# 왼쪽 위 사이트 제목 — 비워둠 (사이드바 프로필로 이름을 대신 표시)
masthead_title           : " "

# 글 URL 형식 (카테고리/제목)
permalink                : /:categories/:title/
# 글 상단에 표시되는 날짜 형식
date_format              : "%Y년 %-m월 %-d일"

# 검색 기능
search                   : true

# 작성자(프로필) 정보 — 사이드바에 표시됩니다
author:
  name             : "김영식"
  avatar           : "/assets/images/blog-profile.jpg"
  bio              : "**Backend Engineer**"
  location         : "Seoul, South Korea"
  # 이름·프로필 사진 클릭 시 이동할 블로그 홈(About 페이지)
  home             : "/about/"
  email            : "ys0000250000@gmail.com"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/zeroway3"
    - label: "포트폴리오"
      icon: "fas fa-fw fa-briefcase"
      url: "/"
    # - label: "LinkedIn"
    #   icon: "fab fa-fw fa-linkedin"
    #   url: "https://www.linkedin.com/in/아이디"

# 푸터의 RSS Feed 링크 숨김
atom_feed:
  hide: true

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/zeroway3"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:ys0000250000@gmail.com"

# 빌드 관련 설정 (수정 불필요)
markdown                 : kramdown
remote_theme             : "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate

paginate                 : 5
paginate_path            : /page:num/

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      show_date: true
      comments: false
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
